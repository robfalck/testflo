[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testflo"
dynamic = ["version"]
description = "A simple flow-based testing framework"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "coverage>=6.0",
]

# The MPI pytest plugin (testflo.pytest_plugin) needs pytest, but the
# testflo *runner* does not -- keep pytest optional so `pip install testflo`
# stays lightweight. Install `testflo[pytest]` to use the plugin, or just
# have pytest present in the environment (the plugin's pytest11 entry point
# only activates under pytest anyway).
[project.optional-dependencies]
pytest = [
    "pytest>=7.4",
    "psutil",
]
mpi = [
    "mpi4py",
]
test = [
    "pytest>=7.4",
    "psutil",
    "mpi4py",
    "pytest-xdist",
    # coverage of spawned mpirun ranks rides on coverage.py's own subprocess
    # mechanism; pytest-cov is here so the plugin's own tests can exercise it.
    "pytest-cov",
]

[project.scripts]
testflo = "testflo.main:main"

# pytest plugin providing testflo-style MPI execution (spawned mpirun per
# @pytest.mark.parallel / N_PROCS test). Loaded only when pytest runs, so
# testflo itself takes no dependency on pytest. Disable per-run with
# `pytest -p no:testflo`.
[project.entry-points.pytest11]
testflo = "testflo.pytest_plugin"

[tool.hatch.version]
path = "testflo/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/testflo",
]

# ---------------------------------------------------------------------------
# pixi workspace
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]
exclude-newer = "7d"

[tool.pixi.dependencies]
python  = ">=3.11"
pip     = "*"

[tool.pixi.pypi-dependencies]
testflo = { path = ".", editable = true }

[tool.pixi.tasks]
test = "testflo --skip_dir=pytest_tests testflo/tests/"

# ---------------------------------------------------------------------------
# MPI implementations.  conda-forge has no MPI packages for win-64, so the
# MPI deps are targeted at linux/osx only; on Windows the same environments
# solve without them and MPI-dependent tests are skipped.
# ---------------------------------------------------------------------------

[tool.pixi.feature.openmpi.target.linux-64.dependencies]
openmpi = "*"
mpi4py  = "*"

[tool.pixi.feature.openmpi.target.osx-arm64.dependencies]
openmpi = "*"
mpi4py  = "*"

[tool.pixi.feature.mpich.target.linux-64.dependencies]
mpich  = "*"
mpi4py = "*"

[tool.pixi.feature.mpich.target.osx-arm64.dependencies]
mpich  = "*"
mpi4py = "*"

# ---------------------------------------------------------------------------
# pytest feature — extends the default environment with pytest tooling
# ---------------------------------------------------------------------------

[tool.pixi.feature.pytest.pypi-dependencies]
pytest       = ">=7.4"
pytest-xdist = "*"
pytest-cov   = "*"
psutil       = "*"

[tool.pixi.feature.pytest.tasks]
test_pytest_plugin = "pytest testflo/tests/pytest_tests/test_pytest_plugin.py"

# ---------------------------------------------------------------------------
# environments
# ---------------------------------------------------------------------------

[tool.pixi.environments]
default      = { features = ["openmpi"],           solve-group = "openmpi" }
mpich        = { features = ["mpich"],            solve-group = "mpich" }
pytest       = { features = ["openmpi", "pytest"], solve-group = "openmpi" }
pytest-mpich = { features = ["mpich", "pytest"],  solve-group = "mpich" }
